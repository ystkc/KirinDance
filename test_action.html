<!DOCTYPE html>
<html>
  <head>
    <style>
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      body div {
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div style="position: relative">
      <canvas id="drawArea"></canvas>
      <canvas
        id="drawMask"
        style="position: absolute; top: 0; right: 0; z-index: 5"
      ></canvas>
    </div>
    <div style="position: fixed; bottom: 20px; left: 0; z-index: 10">
      <div id="currentStrokeSpeed"></div>
      <div id="currentStrokeAngle"></div>
      <div>
        <button id="recordBtn">录制</button>
        <button id="replayBtn">播放</button>
      </div>
    </div>
    <script>
        // canvas层叠顺序从上到下：passiveCanvas, canvas, skeletonCanvas(可与img或video共用)
      class Track {
        angleToArrow = (angle) => {
          switch (Math.floor(angle / 45)) {
            case 0:
              return "↑";
            case 1:
              return "↗";
            case 2:
              return "→";
            case 3:
              return "↘";
            case 4:
              return "↓";
            case 5:
              return "↙";
            case 6:
              return "←";
            case 7:
              return "↖";
          }
        };
        typeToColor = (type) => {
          switch (type) {
            case -1:
              return "rgba(135, 206, 250, 0.5)"; // 天蓝87ceeb99
            case 0:
              return "rgba(128, 255, 208, 0.5)"; // #7fffd499 青色
            case 1:
              return "rgba(255, 192, 203, 0.5)"; // #ffc0cb99 粉色
            case -99:
              return "rgba(192, 192, 192, 0.1)"; // #c0c0c099 浅灰色，active，在部分现代浏览器中有水墨stroke效果
            case -98:
              return "rgba(64, 64, 64, 0.1)";
            case 99:
              return "rgba(245, 222, 179, 0.5)"; // f5deb399 麦色，passive
          }
        };
        constructor(ctx, passiveCtx) {
          this.ctx = ctx;
          this.passiveCtx = passiveCtx;
          this.isDrawing = false;
          this.onNode = false;
          this.nodes = []; // 存储节点坐标的数组
          this.detailNodes = []; // 存储详细轨迹的数组
          this.standardNodes = []; // 标准轨迹的节点坐标数组
          this.standardDetailNodes = []; // 标准轨迹的详细轨迹数组
          this.standardNodesCnt = 0;
          this.standardDetailCnt = 0;
          this.score = []; // 标准轨迹和用户轨迹对比得分
          this.lastPos = { x: 0, y: 0}; // 记录上一次位置
          this.lastPos2 = { x: 0, y: 0}; // 记录上上次位置
          this.lastSpeedCheck = 0; // 记录距离上一次速度检查的move数量
          this.lastSpeedPos = { x: 0, y: 0, time: 0 }; // 记录上一次速度检查的位置和时间
          this.strokeSpeed = 0; // 当前画笔速度
          this.angle = 0; // 当前画笔角度
          this.progress = 0; // Standard绘制进度(index)
          this.nodeProgress = 0; // StandardNodes绘制进度(index)
          this.startTime = 0; // Passive开始时间
          this.detailProgress = 0; // Review模式下detail绘制进度(index)
        }

        startDrawing = (e, timestamp) => {
          this.isDrawing = true;
          let currentTime = 0;
          if (typeof timestamp === "undefined") currentTime = Date.now();
          else currentTime = timestamp;

          // 初始化绘制样式
          this.ctx.beginPath();
          this.ctx.lineWidth = 20;
          this.ctx.lineCap = "round";

          if (this.standardNodesCnt !== 0) {
            this.ctx.moveTo(
              this.standardDetailNodes[this.progress].x,
              this.standardDetailNodes[this.progress].y
            );
            this.ctx.strokeStyle = this.typeToColor(-99); // passive+active画笔颜色
          } else {
            this.ctx.moveTo(e.offsetX, e.offsetY);
            this.ctx.strokeStyle = this.typeToColor(-99); // active画笔颜色
          }
          if (!this.startTime) this.startTime = currentTime;
          this.passiveCtx.beginPath();
          this.passiveCtx.lineWidth = 10;
          this.passiveCtx.lineCap = "round";
          this.passiveCtx.strokeStyle = this.typeToColor(99); // passive画笔颜色
          this.passiveCtx.moveTo(e.offsetX, e.offsetY);
        };

        draw = (e, timestamp) => {
          if (this.standardNodesCnt !== 0) {
            this.passiveDraw(e, timestamp);
            return;
          }
          let currentTime = 0;
          if (typeof timestamp === "undefined")
            currentTime = Date.now() - this.startTime;
          else currentTime = timestamp;
          if (!this.isDrawing) return;
          if (this.onNode) {
            this.onNode = false;
            this.startDrawing(e);
            return;
          }

          const currentX = e.offsetX;
          const currentY = e.offsetY;
          const state = {nodesIndex: null, x: currentX, y: currentY};
          if (currentX === this.lastPos.x && currentY === this.lastPos.y)
            return;

          // 绘制基础轨迹
          this.ctx.lineTo(currentX, currentY);
          this.ctx.stroke();

          // 节点绘制逻辑
          if (this.nodes.length < 2) {
            // 第一个节点
            this.nodes.push({
              x: currentX,
              y: currentY,
              type: -1,
              time: currentTime,
              detailIndex: 0,
              prevDetailIndex: 0,
            });
            this.drawNode(currentX, currentY, this.typeToColor(-1));
            state.nodesIndex = this.nodes.length - 1;
          } else {
            const lastNode = this.nodes[this.nodes.length - 1];
            const lastNode2 = this.nodes[this.nodes.length - 2];
            const manhattanDist =
              Math.abs(currentX - lastNode.x) + Math.abs(currentY - lastNode.y);

            this.lastSpeedCheck++;
            if (this.lastSpeedCheck > 2) { // 注意这个参数：过大会导致切分点不准，过小会消耗过多性能产生更多detail点
              this.lastSpeedCheck = 0;
              this.calcSpeedAndAngle(currentX, currentY, currentTime);
            }

            // 条件判断
            if (manhattanDist > 200 && this.strokeSpeed <= 200) {
              this.nodes.push({
                x: this.lastPos2.x,
                y: this.lastPos2.y,
                type: 0,
                time: currentTime,
                detailIndex: this.detailNodes.length,
                prevDetailIndex: lastNode.detailIndex,
              });
              this.drawNode(
                this.lastPos2.x,
                this.lastPos2.y,
                this.typeToColor(0)
              );
              this.lastSpeedCheck = 0; // 防止一个节点连续出现多个节点（与节点距离过小，容易出现测量错误）
              this.angle = 0;
              this.strokeSpeed = 9999;
              state.nodesIndex = this.nodes.length - 1;
            } else if (
              manhattanDist > 100 &&
              (this.angle > 45 || this.angle < -45)
            ) {
              this.nodes.push({
                x: this.lastPos2.x,
                y: this.lastPos2.y,
                type: 1,
                time: currentTime,
                detailIndex: this.detailNodes.length,
                prevDetailIndex: lastNode.detailIndex,
              });
              this.drawNode(
                this.lastPos2.x,
                this.lastPos2.y,
                this.typeToColor(1)
              );
              this.lastSpeedCheck = 0;
              this.angle = 0;
              this.strokeSpeed = 9999;
              state.nodesIndex = this.nodes.length - 1;
            }
          }

          // 更新位置记录
          this.lastPos2 = this.lastPos;
          this.lastPos = { x: currentX, y: currentY };
          return state;
        };
        pushData = (standardData) => {
          // 传入标准数据
          const { nodes, detailNodes } = standardData;
          this.standardNodes = nodes;
          this.standardDetailNodes = detailNodes;
          this.standardNodesCnt = nodes.length;
          this.standardDetailCnt = detailNodes.length;
        };
        popData = () => {
          this.standardNodes = [];
          this.standardDetailNodes = [];
          this.standardNodesCnt = 0;
          this.standardDetailCnt = 0;
          this.score = [];
        };
        passiveDraw = (e, timestamp) => {
          // 和draw功能相同，但节点是由pushData传入的数据决定（而不是由e决定）
          // 如果用户不移动鼠标，此函数会不被调用导致卡顿，但由于最终是由定频率姿态检测输入，不会出现这种情况
          if (
            !this.isDrawing ||
            this.progress >= this.standardDetailCnt ||
            this.nodeProgress >= this.standardNodesCnt
          )
            return;
          let currentTime = 0;
          if (typeof timestamp === "undefined")
            currentTime = Date.now() - this.startTime;
          else currentTime = timestamp;
          const currentX = e.offsetX;
          const currentY = e.offsetY;
          if (this.onNode) {
            this.onNode = false;
            this.startDrawing(e);
            return;
          }
          while (currentTime > this.standardDetailNodes[this.progress].time) {
            this.detailNodes.push({
              x: currentX,
              y: currentY,
              time: currentTime,
            });
            this.progress++;
            if (this.progress == this.standardDetailCnt) return;
          }
          const cstd = this.standardDetailNodes[this.progress];
          let standardX = cstd.x;
          let standardY = cstd.y;

          // 绘制基础轨迹
          this.passiveCtx.lineTo(currentX, currentY);
          this.passiveCtx.stroke();
          // 绘制standard轨迹
          this.ctx.lineTo(standardX, standardY);
          this.ctx.stroke();

          let cstdn = this.standardNodes[this.nodeProgress];
          if (cstdn.type === -1)
            this.drawNode(cstdn.x, cstdn.y, this.typeToColor(cstdn.type)); // 绘制节点
          while (currentTime > cstdn.time) {
            // 计算上一段的残差平方和作为分数储存（消除起点偏移）
            this.nodes.push({
              x: currentX,
              y: currentY,
              type: cstdn.type,
              time: currentTime,
            });
            let score = 0;
            const deltaX =
              this.standardDetailNodes[cstdn.prevDetailIndex].x -
              this.detailNodes[cstdn.prevDetailIndex].x;
            const deltaY =
              this.standardDetailNodes[cstdn.prevDetailIndex].y -
              this.detailNodes[cstdn.prevDetailIndex].y; // 标准轨迹和用户轨迹起点的差距
            let relativeX = 0,
              relativeY = 0;

            for (let i = cstdn.prevDetailIndex; i < cstdn.detailIndex; i++) {
              relativeX =
                this.standardDetailNodes[i].x - this.detailNodes[i].x - deltaX;
              relativeY =
                this.standardDetailNodes[i].y - this.detailNodes[i].y - deltaY;
              score += relativeX ** 2 + relativeY ** 2;
            }
            score = Math.max(100 - score / 1000 / (cstdn.detailIndex - cstdn.prevDetailIndex), 0).toFixed(0);
            // 除以节点数量，防止标准轨迹长度过长导致分数过低（或反之亦然）
            this.score[this.nodeProgress] = score;
            this.onNode = true;
            this.nodeProgress++;
            this.drawNode(currentX, currentY, this.typeToColor(99)); // 绘制用户轨迹节点
            const midPoint =
              this.detailNodes[
                (cstdn.detailIndex + cstdn.prevDetailIndex) >> 1
              ]; // 上一段的中点

            if (this.nodeProgress > 1) {
              // 跳过第一段起点节点的分数绘制
              // 将分数打印在passiveCtx的上一段轨迹的中间
              passiveCtx.beginPath();
              passiveCtx.moveTo(midPoint.x, midPoint.y);
              passiveCtx.font = "20px Arial";
              passiveCtx.fillStyle = "rgba(0, 0.5)";
              passiveCtx.fillText(
                score,
                midPoint.x - 10,
                midPoint.y - 10
              );
              passiveCtx.closePath();
            }
            if (this.nodeProgress < this.standardNodesCnt) {
              cstdn = this.standardNodes[this.nodeProgress]; // 画出下一段的标准节点
              this.drawNode(cstdn.x, cstdn.y, this.typeToColor(cstdn.type));
            } else return;
          }
        };
        reviewDraw = (nodeIndex, startTime, currentTimestamp) => {
            const detailIndexStart = this.standardNodes[nodeIndex].prevDetailIndex;
            const detailIndexEnd = this.standardNodes[nodeIndex].detailIndex;

            // 如果刚开始，需要绘制起、终点节点
            if (startTime === currentTimestamp) {
                this.detailProgress = detailIndexStart;
                this.drawNode(this.standardNodes[nodeIndex].x, this.standardNodes[nodeIndex].y, this.typeToColor(this.standardNodes[nodeIndex].type));
                this.drawNode(this.standardNodes[nodeIndex + 1].x, this.standardNodes[nodeIndex + 1].y, this.typeToColor(this.standardNodes[nodeIndex + 1].type));
                // 用户轨迹
                this.drawNode(this.nodes[nodeIndex].x, this.nodes[nodeIndex].y, this.typeToColor(99));
                this.drawNode(this.nodes[nodeIndex + 1].x, this.nodes[nodeIndex + 1].y, this.typeToColor(99));
                ctx.beginPath();
                ctx.moveTo(this.standardDetailNodes[detailProgress].x, this.standardDetailNodes[detailProgress].y);
                ctx.lineWidth = 20;
                ctx.strokeStyle = this.typeToColor(-99);
                passiveCtx.beginPath();
                passiveCtx.moveTo(this.detailNodes[detailProgress].x, this.detailNodes[detailProgress].y);
                passiveCtx.lineWidth = 10;
                passiveCtx.strokeStyle = this.typeToColor(99);
            }
            let currentTime = currentTimestamp - startTime;
            // 如果时间已经超过当前节点的结束时间，则绘制分数并返回
            if (currentTime >= this.standardDetailNodes[this.detailProgress].time) {
                const score = this.score[nodeIndex];
                const midPoint = {
                    x: (this.standardDetailNodes[detailIndexStart].x + this.standardDetailNodes[detailIndexEnd].x) / 2,
                    y: (this.standardDetailNodes[detailIndexStart].y + this.standardDetailNodes[detailIndexEnd].y) / 2,
                };
                ctx.beginPath();
                ctx.moveTo(midPoint.x, midPoint.y);
                ctx.font = "20px Arial";
                ctx.fillStyle = "rgba(0, 0.5)";
                ctx.fillText(score, midPoint.x - 10, midPoint.y - 10);
                ctx.closePath();
                return;
            }
            // 画出detailProgress后，currentTime前的detailNodes
            while(this.detailProgress < detailIndexEnd) {
                const detailNode = this.detailNodes[this.detailProgress];
                const stdDetailNode = this.standardDetailNodes[this.detailProgress];
                if (detailNode.time > currentTime) break;
                ctx.lineTo(stdDetailNode.x, stdDetailNode.y);
                ctx.stroke();
                passiveCtx.lineTo(detailNode.x, detailNode.y);
                passiveCtx.stroke();
                this.detailProgress++;
            }
        }

        calcSpeedAndAngle = (currentX, currentY, currentTime) => {
          // 速度计算
          if (this.lastSpeedPos.time === 0) {
            this.lastSpeedPos = { x: currentX, y: currentY, time: currentTime };
          }
          this.strokeSpeed = (
            ((Math.abs(currentX - this.lastSpeedPos.x) +
              Math.abs(currentY - this.lastSpeedPos.y)) /
              (currentTime - this.lastSpeedPos.time)) *
            1000
          ).toFixed(2);
          document.getElementById(
            "currentStrokeSpeed"
          ).innerHTML = `当前速度: ${this.strokeSpeed}px/s`;

          // 角度计算
          // 计算偏移向量
          const prevNode = this.nodes[this.nodes.length - 1];
          const prevVector = {
            x: currentX - prevNode.x,
            y: currentY - prevNode.y,
          };
          const currentVector = {
            x: currentX - this.lastSpeedPos.x,
            y: currentY - this.lastSpeedPos.y,
          };

          // 计算向量夹角
          const dotProduct =
            prevVector.x * currentVector.x + prevVector.y * currentVector.y;
          const magPrev = Math.sqrt(prevVector.x ** 2 + prevVector.y ** 2);
          const magCurrent = Math.sqrt(
            currentVector.x ** 2 + currentVector.y ** 2
          );
          this.angle =
            Math.acos(dotProduct / (magPrev * magCurrent)) * (180 / Math.PI);
          document.getElementById(
            "currentStrokeAngle"
          ).innerHTML = `当前角度: ${this.angle.toFixed(2)}°`;

          this.detailNodes.push({x: this.lastSpeedPos.x, y: this.lastSpeedPos.y, time: currentTime});
          this.lastSpeedPos = { x: currentX, y: currentY, time: currentTime };
        };

        drawNode = (x, y, color = "rgba(0, 0, 0, 0.5)") => {
          this.ctx.closePath();
          this.ctx.beginPath();
          this.ctx.lineWidth = 20;
          this.ctx.arc(x, y, 20, 0, Math.PI * 2); // 30px直径
          this.ctx.fillStyle = color;
          this.ctx.fill();
          this.ctx.closePath();
          this.onNode = true;

          return;
          // 连接lastNode，并作中垂线
          const lastNode = this.nodes[this.nodes.length - 1];
          this.ctx.beginPath();
          this.ctx.lineWidth = 10;
          this.ctx.strokeStyle = this.typeToColor(99);
          this.ctx.moveTo(lastNode.x, lastNode.y);
          this.ctx.lineTo(x, y);
          this.ctx.stroke();
          this.ctx.closePath();
        };

        endDrawing = (e) => {
          if (!this.isDrawing) return;
          this.draw(e); // 处理最后一段数据
          this.ctx.closePath();
          this.isDrawing = false;
          this.lastPos = { x: 0, y: 0 };
          this.lastPos2 = { x: 0, y: 0 };
          this.lastSpeedPos = { x: 0, y: 0, time: 0 };
          this.lastSpeedCheck = 0;
          this.progress = 0;
          this.nodeProgress = 0;
          this.startTime = 0;

          // 去除time偏移量
          let timeOffset = Math.min(
            this.nodes[0].time,
            this.detailNodes[0].time
          );
          for (let i = 0; i < this.nodes.length; i++) {
            this.nodes[i].time -= timeOffset;
          }
          for (let i = 0; i < this.detailNodes.length; i++) {
            this.detailNodes[i].time -= timeOffset;
          }
          this.result = {
            nodes: this.nodes.slice(1),
            detailNodes: this.detailNodes,
            score: this.score,
          };

          this.nodes = [];
          this.detailNodes = [];
          this.score = [];
        };
      }
      class Action {
/*Id	Part
0	nose
1	leftEye
2	rightEye
3	leftEar
4	rightEar
5	leftShoulder
6	rightShoulder
7	leftElbow
8	rightElbow
9	leftWrist
10	rightWrist
11	leftHip
12	rightHip
13	leftKnee
14	rightKnee
15	leftAnkle
16	rightAnkle

5, 6, leftShoulder-rightShoulder
5, 7, leftShoulder-leftElbow
5, 11, leftShoulder-leftHip
7, 9, leftElbow-leftWrist
6, 8, rightShoulder-rightElbow
6, 12, rightShoulder-rightHip
8, 10, rightElbow-rightWrist
11, 13, leftHip-leftKnee
13, 15, leftKnee-leftAnkle
12, 14, rightHip-rightKnee
14, 16 rightKnee-rightAnkle*/
        seg = [5, 6, 5, 7, 5, 11, 7, 9, 6, 8, 6, 12, 8, 10, 11, 13, 13, 15, 12, 14, 14, 16];
        segCnt = 11;
        actionTypeToColor = (type) => {
          switch (type) {
            case 0: // 人体连线
              return "rgba(0, 0, 0, 0.1)";
            case 1: // 关节
              return "rgba(238, 130, 238, 0.5)"; // 紫色 ee82ee99
          }
        }
        constructor(canvas, passiveCanvas, skeletonCanvas) {
          this.canvas = canvas;
          this.ctx = canvas.getContext("2d");
          this.passiveCanvas = passiveCanvas;
          this.passiveCtx = passiveCanvas.getContext("2d");
          this.skeletonCanvas = skeletonCanvas;
          this.skeletonCtx = skeletonCanvas.getContext("2d");
          // 一共13个关节trackers
          this.trackers = [
            new Track(this.ctx, this.passiveCtx), // 0 nose
            new Track(this.ctx, this.passiveCtx), // 5 leftShoulder
            new Track(this.ctx, this.passiveCtx), // 6 rightShoulder
            new Track(this.ctx, this.passiveCtx), // 7 leftElbow
            new Track(this.ctx, this.passiveCtx), // 8 rightElbow
            new Track(this.ctx, this.passiveCtx), // 9 leftWrist
            new Track(this.ctx, this.passiveCtx), // 10 rightWrist
            new Track(this.ctx, this.passiveCtx), // 11 leftHip
            new Track(this.ctx, this.passiveCtx), // 12 rightHip
            new Track(this.ctx, this.passiveCtx), // 13 leftKnee
            new Track(this.ctx, this.passiveCtx), // 14 rightKnee
            new Track(this.ctx, this.passiveCtx), // 15 leftAnkle
            new Track(this.ctx, this.passiveCtx), // 16 rightAnkle
          ];
          this.action = [];
        }
        pushData = (poseData) => {// 结构：{actions, tresults}
            const { actions, tresults } = poseData;
            this.standardActions = actions;
            for (let i=0;i<tresults.length;i++) {
                this.trackers[i].pushData(tresults[i]);
            }
        };
        drawSkeletons = (positions) => {
            // 绘制人体骨骼
            for (let i=0;i<Action.segCnt;i++) {
                const start = Action.seg[i<<1];
                const end = Action.seg[(i<<1)|1];
                this.skeletonCtx.beginPath();
                this.skeletonCtx.moveTo(positions.keypoints[start].x, positions.keypoints[start].y);
                this.skeletonCtx.lineTo(positions.keypoints[end].x, positions.keypoints[end].y);
                this.skeletonCtx.strokeStyle = this.actionTypeToColor(0);
                this.skeletonCtx.stroke();
                this.skeletonCtx.closePath();
            }
            // 绘制关节
            for (let i = 0; i < positions.length; i++) {
                if (i > 0 && i < 5 || pose.keypoints[i].score < 0.5) {
                    continue;
                }
                this.trackers[i].draw(positions[i], currentTime);
            }
            const actionNodes = {}, positionX = [], positionY = [];
            for (let i = 0; i < positions.length; i++) {
                if (i > 0 && i < 5 || pose.keypoints[i].score < 0.5) {
                    continue;
                }
                status = this.trackers[i].draw(positions[i], currentTime) 
                if (status.nodesIndex !== null) actionNodes[i] = status.nodesIndex;
                positionX.push(positions[i].x);
                positionY.push(positions[i].y);
            }
        }
        startDrawing = (pose, timestamp) => {
          this.isDrawing = true;
          let currentTime = 0;
          if (typeof timestamp === "undefined")
            currentTime = Date.now();
          else currentTime = timestamp;
          this.startTime = currentTime;
          const position = pose.keypoints.map(keypoint => ({ x: keypoint.position.x, y: keypoint.position.y }));
          for (let i = 0; i < this.trackers.length; i++) {
            this.trackers[i].startDrawing(position[i], currentTime);
          }
        };
        draw = (pose, timestamp) => {
            let currentTime = 0;
            if (typeof timestamp === "undefined")
              currentTime = Date.now() - this.startTime;
            else currentTime = timestamp;

            const positions = pose.keypoints.map(keypoint => ({ x: keypoint.position.x, y: keypoint.position.y }));
            
            this.drawSkeletons(positions);

            
            // 遇到了动作节点
            if (currentTime - this.lastActionTime < 1000) { // ms，如果是frame需要调参
                const prevActionNodes = this.action[this.action.length - 1].nodes;
                // 动作节点连续，合并(无需处理tracker逻辑，零碎节点误判不会影响动作回放)
                for (nodes of Object.keys(actionNodes)) if (!prevActionNodes.hasOwnProperty(nodes)) prevActionNodes[nodes] = actionNodes[nodes];
                this.action[this.action.length - 1].nodes = Array.from(prevActionNodes);
            } else {
                this.action.push({nodes: actionNodes, time: currentTime});
                this.lastActionTime = currentTime;
            }
       };
        passiveDraw = (pose, timestamp) => {
            let currentTime = 0;
            if (typeof timestamp === "undefined")
              currentTime = Date.now() - this.startTime;
            else currentTime = timestamp;

            const positions = pose.keypoints.map(keypoint => ({ x: keypoint.position.x, y: keypoint.position.y }));
            this.drawSkeletons(positions);
            for (let i = 0; i < this.trackers.length; i++) {
                this.trackers[i].passiveDraw(position[i], currentTime);
            }
        }
        reviewDraw = (nodeIndex, startTime, currentTime) => {
            for (tracker of this.trackers) {
                tracker.reviewDraw(nodeIndex, startTime, currentTime);
            }
        }

        endDrawing = () => {
          this.isDrawing = false;
          for (let i = 0; i < this.trackers.length; i++) {
            this.trackers[i].endDrawing();
          }
          this.lastActionTime = -9999;
        // 导出动作数据
          const tresults = [], tscores = [];
          for (tracker of this.trackers) {
            tresults.push(tracker.result);
            tscores.push(tracker.score);
          }
          this.result = {
            action: this.action,
            tresults: tresults,
            tscores: tscores,
          };
        }; 
      }
      class ActionRecorder {
        // 负责记录动作图像，并提供动作回放功能
        constructor(skeletonCanvas) {
          this.skeletonCanvas = skeletonCanvas;
          this.skeletonCtx = skeletonCanvas.getContext("2d");
          this.imgs = [];
          this.imgsLength = 0;
        }
        pushImg = (img) => {
          this.imgs.push(img);
          this.imgsLength++;
          // 绘制
        //   this.skeletonCtx.clearRect(0, 0, this.skeletonCanvas.width, this.skeletonCanvas.height);
          this.skeletonCtx.drawImage(img, 0, 0);
          return this.imgsLength - 1;
        }
        replayImg = (index) => {
          if (index < 0 || index >= this.imgsLength) return;
        //   this.skeletonCtx.clearRect(0, 0, this.skeletonCanvas.width, this.skeletonCanvas.height);
          this.skeletonCtx.drawImage(this.imgs[index], 0, 0);
        }
        clear = () => {
          this.imgs = [];
          this.imgsLength = 0;
          this.skeletonCtx.clearRect(0, 0, this.skeletonCanvas.width, this.skeletonCanvas.height);
        }
    }


      const canvas = document.getElementById("drawArea");
      const ctx = canvas.getContext("2d");
      const passiveCanvas = document.getElementById("drawMask");
      const passiveCtx = passiveCanvas.getContext("2d");

      // 初始化画布尺寸
      function initCanvas(canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      initCanvas(canvas);
      initCanvas(passiveCanvas);
      window.addEventListener("resize", initCanvas(canvas));
      window.addEventListener("resize", initCanvas(passiveCanvas));
      let resultBuffer = null;
      track = new Track(ctx, passiveCtx);
      passiveCanvas.addEventListener("mousedown", track.startDrawing);
      passiveCanvas.addEventListener("mousemove", track.draw);
      passiveCanvas.addEventListener("mouseup", track.endDrawing);
      passiveCanvas.addEventListener("mouseout", track.endDrawing);
      document.getElementById("recordBtn").addEventListener("click", () => {
        passiveCtx.clearRect(0, 0, passiveCanvas.width, passiveCanvas.height);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        resultBuffer = null;
        track.popData();
      });
      document.getElementById("replayBtn").addEventListener("click", () => {
        passiveCtx.clearRect(0, 0, passiveCanvas.width, passiveCanvas.height);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!resultBuffer) {
          resultBuffer = track.result;
        }
        track.pushData(resultBuffer);
        track.drawNode(
          track.standardNodes[0].x,
          track.standardNodes[0].y,
          track.typeToColor(track.standardNodes[0].type)
        );
      });
    </script>
