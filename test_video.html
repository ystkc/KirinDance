<!-- 在HTML中放置video元素 -->
<video id="video" controls></video>

<script>
// 获取video元素
const video = document.getElementById('video');

// 设置视频源
video.src = '/static/std.mp4';

// 尝试自动播放（需注意浏览器策略）
video.play()
  .catch(error => {
    console.log('需要用户交互后才能自动播放，请点击视频控件播放');
    // 可以在这里添加一个按钮让用户手动触发播放
  });

// 可选：静音后自动播放（绕过部分浏览器限制）
// video.muted = true;
// video.play();
</script>
